[project]
name = "droid-sdk"
version = "0.2.0"
description = "Python asyncio SDK for Factory Droid"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.27,<2",
    "starlette>=0.40",
    "uvicorn>=0.31,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "pyright",
    "ruff",
    "pytest-cov",
    # The dev environment always includes the "mcp" extra's dependencies so
    # the in-process MCP server tests run without extra flags.
    "mcp>=1.27,<2",
    "starlette>=0.40",
    "uvicorn>=0.31,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/droid_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests/typing/positive.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests/typing/positive.py"]
pythonVersion = "3.10"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
